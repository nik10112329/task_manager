name: task_manager
description: My pet Project
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # state management
  flutter_bloc_side_effect: ^0.0.2
  bloc_concurrency: ^0.2.5

  # navigation
  auto_route: ^11.1.0

  # persistence
  drift: ^2.20.3
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.2
  sqlite3_flutter_libs: ^0.5.24

  # utils
  device_info_plus: ^11.0.0
  flutter_dotenv: ^5.1.0
  flutter_native_splash: ^2.4.1
  logger: ^2.4.0
  package_info_plus: ^8.0.3
  permission_handler: ^12.0.3
  theme_tailor: ^3.0.1
  email_validator: ^3.0.0
  jwt_decoder: ^2.0.1
  flutter_cache_manager: ^3.4.1
  geolocator: ^13.0.1
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  flutter_shaders: ^0.1.3
  flutter_svg: ^2.2.3
  pkce: ^1.1.0+1
  uuid: ^4.5.3
  animated_theme_switcher: ^2.0.10

  #widgets
  webview_flutter: ^4.9.0
  shimmer: ^3.0.0
  flutter_touch_ripple: ^2.2.32
  flutter_circle_color_picker: ^0.3.0

  # http
  dio: ^5.7.0
  retrofit: ^4.9.2
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_db_store: ^5.1.1
  http: ^1.6.0
  oauth2: ^2.0.2
  flutter_web_auth_2: ^5.0.1
  web_socket_channel: ^3.0.3
  cached_network_image: ^3.4.1

  # google
  firebase_core: ^4.4.0
  google_sign_in: ^7.2.0
  google_sign_in_platform_interface: ^3.1.0
  firebase_database: ^12.1.3
  cloud_firestore: ^6.1.2

  #push_notifications
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^21.0.0
  flutter_rustore_push: ^7.2.0

  #vk
  vkid_flutter_sdk: ^1.0.3

  # localization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.5
  flutter_lints: ^6.0.0
  freezed: ^3.2.4
  json_serializable: ^6.11.4
  retrofit_generator: ^10.2.1
  dart_code_metrics_presets: ^2.29.0
  auto_route_generator: ^10.4.0
  intl_utils: ^2.8.13
  flutter_svg: ^2.2.3
  flutter_launcher_icons: ^0.13.1

flutter_intl:
  enabled: true
  output_dir: lib/app/localization/generated
  arb_dir: lib/app/localization

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo.png"  # твой файл 1024x1024
  min_sdk_android: 21
  adaptive_icon_background: "#4474c0"  # цвет фона или путь к картинке
  adaptive_icon_foreground: "assets/logos/circle_logo.png"  # только логотип

flutter_native_splash:
  color: "#4474c0"
  image: 'assets/backgrounds/splash.png'
  android_12:
    color: "#4474c0"
    image: 'assets/backgrounds/splash.png'
  ios: true
  android: true
  web: false

flutter_gen:
  output: lib/app/values/
  line_length: 80

flutter:
  uses-material-design: true
  shaders:
    - shaders/shader.frag
    - shaders/liquid_glass_lens.frag
    - shaders/rosa_shader.frag
    - shaders/liquid.frag
    - shaders/gas_rainbow.frag
    - shaders/liquid_glass.frag
    - shaders/test_shader.frag
    - shaders/gradient_flow.frag
    - shaders/vk_background.frag
  assets:
    - .configs/prod/
    - .configs/dev/
    - assets/logos/
    - assets/images/
  fonts:
    - family: Task Manager Icons
      fonts:
        - asset: fonts/icons/TaskManager_Icons.ttf
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Bold.ttf
          weight: 700